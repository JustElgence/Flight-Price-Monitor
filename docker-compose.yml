services:
  flymon:
    build: .
    container_name: flymon
    ports:
      - "8090:8000"
    environment:
      - FLYMON_USERNAME=admin
      - FLYMON_PASSWORD=zxcvbnm2001
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
